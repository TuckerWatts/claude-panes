# tmux config for `panes` only (runs on its own socket: tmux -L claude),
# so it never touches any other tmux you use.

set -g mouse on                      # click a pane to focus it, wheel scrolls
set -g escape-time 10
set -g focus-events on
set -g extended-keys on              # so shift+enter etc. reach Claude
set -g default-terminal "tmux-256color"
set -g history-limit 50000

# Each pane's header: name, status, effort, and what the session is about,
# e.g.  " 🟢 api-cb  ● needs you · high · Fix pane titles"
# All set live by tab-state.sh (pane options @state @effort @topic, title
# via select-pane -T). Programs can't overwrite the title with their own.
set -g allow-set-title off
set -g pane-border-status top
# Name: orange when focused. Status: a coloured dot + word (red needs
# you, amber working, green done). Effort and topic in dim grey.
set -g pane-border-format " #{?pane_active,#[fg=colour208 bold],#[fg=colour250]}#{pane_title}#[default]  #{?#{==:#{@state},waiting},#[fg=colour203]● needs you,#{?#{==:#{@state},working},#[fg=colour179]● working,#{?#{==:#{@state},done},#[fg=colour108]● done,}}}#[fg=colour243]#{?#{@effort}, · #{@effort},}#{?#{@topic}, · #{=/28/…:@topic},} #[default]"
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour239"
set -g pane-active-border-style "fg=colour208"
set -g allow-rename off

# Terminal tab title for the whole workspace.
set -g set-titles on
set -g set-titles-string "🧩 panes"

# Bottom right: account usage limits (set as @limits by hooks/panes-feed.sh
# from your status line), then a dim reminder; ⌃b ? opens the guide.
set -g status-position bottom
set -g status-style "bg=default,fg=colour237"
set -g status-left ""
set -g status-right "#[fg=colour250,bold]Claude usage #[nobold]#{E:@limits}#[fg=colour242]   ⌃b ? guide "
set -g status-right-length 120
bind ? display-popup -w 64 -h 25 -b rounded -S "fg=colour240" \
  -E "cat ~/.claude/panes-guide.txt; read -sk1"
set -g window-status-format ""
set -g window-status-current-format ""

# ⌃b p: pick a $PANES_ROOT project to open in a new pane.
bind p display-popup -w 50 -h 26 -b rounded -S "fg=colour240" -E "~/.local/bin/panes --pick"
# Close a pane (⌃b x, or /exit then exit) → the rest re-balance.
set-hook -g after-kill-pane "run-shell -b '~/.local/bin/panes --relayout'"
set-hook -g pane-exited "run-shell -b '~/.local/bin/panes --relayout'"
# Re-fit when the window attaches or changes size (keeps the shell strip short).
set-hook -g client-attached "run-shell -b '~/.local/bin/panes --relayout'"
set-hook -g client-resized "run-shell -b '~/.local/bin/panes --relayout'"
set-hook -g window-resized "run-shell -b '~/.local/bin/panes --relayout'"
# Focus a pane (click, ⌃b arrows) → it moves into the big spot.
set-hook -g after-select-pane "run-shell -b '~/.local/bin/panes --relayout'"

